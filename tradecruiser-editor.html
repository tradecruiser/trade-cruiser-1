<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeCruiser — Editor Presentazione</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:     #F7F3ED;
  --white:  #FDFBF8;
  --dark:   #2B2B2B;
  --mid:    #888;
  --light:  #EDE8DF;
  --border: #DDD8CE;
  --green:  #5ab848;
  --orange: #f5901e;
  --purple: #9b2c8e;
}
body {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  background: #E3DDD5;
  color: var(--dark);
  height: 100vh;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── TOOLBAR ── */
.toolbar {
  height: 52px; background: var(--white);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; padding: 0 16px;
  flex-shrink: 0; z-index: 100;
}
.logo-mark { display: flex; align-items: center; gap: 8px; margin-right: 12px; }
.logo-mark svg { width: 26px; height: 26px; }
.logo-mark span { font-size: 14px; font-weight: 600; letter-spacing: -.3px; }
.sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }
.tb-btn {
  height: 30px; padding: 0 11px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--white);
  cursor: pointer; font-size: 12px; font-weight: 500; color: var(--dark);
  transition: background .1s;
}
.tb-btn:hover { background: var(--light); }
.tb-btn.primary { background: var(--dark); color: #fff; border-color: var(--dark); }
.tb-btn.primary:hover { background: #444; }
.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.slide-counter { font-size: 11px; color: var(--mid); }

/* ── MAIN ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 192px; background: var(--white);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
}
.sidebar-top {
  padding: 9px 10px 7px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.sidebar-top span { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--mid); }
.add-btn {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--dark); color: #fff; border: none; cursor: pointer;
  font-size: 14px; display: flex; align-items: center; justify-content: center;
}
.slide-list { flex: 1; overflow-y: auto; padding: 7px; display: flex; flex-direction: column; gap: 5px; }
.slide-thumb {
  border: 1.5px solid var(--border); border-radius: 5px;
  cursor: pointer; overflow: hidden; position: relative;
  aspect-ratio: 16/9; background: var(--bg); transition: border-color .12s;
}
.slide-thumb.active { border-color: var(--dark); }
.slide-thumb:hover:not(.active) { border-color: #aaa; }
.thumb-num {
  position: absolute; bottom: 3px; left: 4px; font-size: 8px;
  color: var(--mid); background: rgba(255,255,255,.85); padding: 1px 4px; border-radius: 3px;
}
.thumb-del {
  position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%;
  background: rgba(0,0,0,.45); color: #fff; border: none; cursor: pointer;
  font-size: 9px; display: none; align-items: center; justify-content: center;
}
.slide-thumb:hover .thumb-del { display: flex; }
.tpl-section { border-top: 1px solid var(--border); padding: 8px 9px 10px; }
.tpl-section h4 { font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--mid); margin-bottom: 5px; }
.tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.tpl-btn {
  aspect-ratio: 16/9; border: 1.5px solid var(--border); border-radius: 4px;
  cursor: pointer; overflow: hidden; position: relative; background: var(--bg); transition: border-color .12s;
}
.tpl-btn:hover { border-color: var(--dark); }
.tpl-btn span {
  position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
  font-size: 7px; font-weight: 600; color: var(--mid);
  background: rgba(255,255,255,.85); padding: 1px 4px; border-radius: 2px; white-space: nowrap;
}

/* ── CANVAS ── */
.canvas-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: auto; padding: 40px;
}
.slide-wrapper {
  width: 960px; height: 540px;
  box-shadow: 0 12px 48px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.07);
  border-radius: 3px; overflow: hidden; flex-shrink: 0;
}

/* ── PROPS ── */
.props {
  width: 196px; background: var(--white); border-left: 1px solid var(--border);
  padding: 14px 12px; display: flex; flex-direction: column; gap: 14px;
  overflow-y: auto; flex-shrink: 0;
}
.props h4 { font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--mid); margin-bottom: 6px; }
.prop-row { display: flex; flex-direction: column; gap: 3px; margin-bottom: 6px; }
.prop-row label { font-size: 10px; color: var(--mid); }
.prop-row input[type=text], .prop-row input[type=color] {
  width: 100%; height: 28px; border: 1px solid var(--border); border-radius: 5px;
  padding: 0 7px; font-size: 11px; color: var(--dark); background: var(--bg);
}
.prop-row input[type=color] { padding: 2px; cursor: pointer; }
.swatches { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.swatch {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: border-color .1s; box-shadow: 0 0 0 1px rgba(0,0,0,.08);
}
.swatch:hover { border-color: var(--dark); }
.hint { font-size: 10px; color: var(--mid); line-height: 1.6; }

/* ════════════════════════════════
   SLIDE BASE
════════════════════════════════ */
.slide {
  width: 960px; height: 540px; position: relative; overflow: hidden;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
.wm { /* watermark */
  position: absolute; right: -20px; top: 50%; transform: translateY(-50%);
  width: 420px; height: 420px; opacity: .09; pointer-events: none;
}
.wm svg { width: 100%; height: 100%; }
[contenteditable] {
  outline: none; cursor: text; border-radius: 2px;
  border: 1px solid transparent; transition: border-color .12s;
}
[contenteditable]:hover { border-color: rgba(90,184,72,.35); }
[contenteditable]:focus { border-color: rgba(90,184,72,.65); background: rgba(90,184,72,.03); }

/* ════════  COVER  ════════ */
.s-cover { background: #F7F3ED; }
.s-cover .wm { opacity: .10; }
.s-cover .inner {
  position: absolute; left: 68px; top: 50%; transform: translateY(-50%); max-width: 500px;
}
.s-cover .eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--mid); margin-bottom: 18px;
}
.s-cover .title {
  font-size: 58px; font-weight: 800; letter-spacing: -2px; line-height: .95;
  color: var(--dark); margin-bottom: 22px;
}
.s-cover .subtitle {
  font-size: 15px; color: #999; line-height: 1.65; margin-bottom: 34px; max-width: 380px;
}
.s-cover .date { font-size: 11px; color: #bbb; letter-spacing: .5px; }
.s-cover .bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--green), var(--orange), var(--purple));
}

/* ════════  SECTION  ════════ */
.s-section { background: #EFF6EC; } /* soft sage */
.s-section .inner { position: absolute; left: 68px; top: 50%; transform: translateY(-50%); }
.s-section .num {
  font-size: 110px; font-weight: 900; letter-spacing: -5px;
  color: rgba(90,184,72,.12); line-height: 1; margin-bottom: -20px;
}
.s-section .label {
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--orange); margin-bottom: 10px;
}
.s-section .title {
  font-size: 44px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.05;
  color: var(--dark); margin-bottom: 14px;
}
.s-section .sub { font-size: 15px; color: var(--mid); max-width: 400px; line-height: 1.55; }
.s-section .bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--green), var(--orange), var(--purple));
}

/* ════════  CONTENT  ════════ */
.s-content { background: #FDFBF8; }
.s-content .accent-bar {
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--green), var(--orange));
}
.s-content .inner { position: absolute; left: 68px; top: 54px; right: 290px; }
.s-content .label {
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--mid); margin-bottom: 10px;
}
.s-content .title {
  font-size: 34px; font-weight: 800; letter-spacing: -.8px; line-height: 1.1;
  color: var(--dark); margin-bottom: 22px;
}
.s-content .body { font-size: 14px; color: #999; line-height: 1.7; margin-bottom: 20px; }
.s-content ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }
.s-content ul li {
  display: flex; align-items: flex-start; gap: 10px;
  font-size: 14px; color: var(--dark); line-height: 1.5;
}
.s-content ul li::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--orange); margin-top: 7px; flex-shrink: 0;
}
.s-content .bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--green), var(--orange), var(--purple));
}

/* ════════  TWO COLS  ════════ */
.s-two { background: #F7F3ED; }
.s-two .head { position: absolute; left: 0; right: 0; top: 0; padding: 36px 68px 0; }
.s-two .label {
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--mid); margin-bottom: 8px;
}
.s-two .title { font-size: 30px; font-weight: 800; letter-spacing: -.6px; color: var(--dark); }
.s-two .cols {
  position: absolute; left: 0; right: 0; top: 136px; bottom: 0;
  display: grid; grid-template-columns: 1fr 1fr;
}
.s-two .col { padding: 28px 44px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.s-two .col:last-child { border-right: none; }
.s-two .dot { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.s-two .col-title { font-size: 16px; font-weight: 700; color: var(--dark); }
.s-two .col-text { font-size: 12px; color: var(--mid); line-height: 1.6; }
.s-two ul { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.s-two ul li { font-size: 12px; color: var(--dark); display: flex; gap: 6px; line-height: 1.4; }
.s-two ul li::before { content: '–'; color: var(--green); font-weight: 700; flex-shrink: 0; }
.s-two .bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--green), var(--orange), var(--purple));
}

/* ════════  STATS  ════════ */
.s-stats { background: #FDFBF8; }
.s-stats .accent-bar {
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--green), var(--orange));
}
.s-stats .head { position: absolute; left: 0; right: 0; top: 0; padding: 36px 68px 0; }
.s-stats .label {
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--mid); margin-bottom: 8px;
}
.s-stats .title { font-size: 30px; font-weight: 800; letter-spacing: -.6px; color: var(--dark); }
.s-stats .grid {
  position: absolute; left: 48px; right: 260px; top: 148px; bottom: 40px;
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; align-content: start;
}
.s-stats .card {
  border: 1px solid var(--border); border-radius: 8px; padding: 20px 16px;
  background: var(--bg); position: relative; overflow: hidden;
}
.s-stats .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
.s-stats .card:nth-child(1)::before { background: var(--green); }
.s-stats .card:nth-child(2)::before { background: var(--orange); }
.s-stats .card:nth-child(3)::before { background: var(--purple); }
.s-stats .val { font-size: 38px; font-weight: 900; letter-spacing: -1px; color: var(--dark); line-height: 1; }
.s-stats .lbl { font-size: 11px; color: var(--mid); margin-top: 6px; }
.s-stats .desc { font-size: 10px; color: #bbb; margin-top: 3px; }
.s-stats .bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--green), var(--orange), var(--purple));
}

/* ════════  QUOTE  ════════ */
.s-quote { background: #F7F3ED; }
.s-quote .inner { position: absolute; left: 80px; right: 300px; top: 50%; transform: translateY(-50%); }
.s-quote .qmark { font-size: 90px; line-height: .8; color: var(--orange); font-family: Georgia, serif; margin-bottom: 4px; }
.s-quote .qtext {
  font-size: 24px; font-weight: 600; line-height: 1.45; letter-spacing: -.4px;
  color: var(--dark); margin-bottom: 24px;
}
.s-quote .attr { font-size: 12px; color: var(--mid); letter-spacing: .5px; }
.s-quote .bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--green), var(--orange), var(--purple));
}

/* ════════  CLOSING  ════════ */
.s-closing { background: #F0EBE2; } /* warm beige, slightly deeper */
.s-closing .wm { opacity: .09; }
.s-closing .accent-side {
  position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: linear-gradient(180deg, var(--green), var(--orange));
}
.s-closing .inner { position: absolute; left: 68px; top: 50%; transform: translateY(-50%); max-width: 520px; }
.s-closing .label {
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
  color: var(--mid); margin-bottom: 18px;
}
.s-closing .title {
  font-size: 44px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.05;
  color: var(--dark); margin-bottom: 18px;
}
.s-closing .sub { font-size: 15px; color: #999; line-height: 1.6; margin-bottom: 30px; }
.s-closing .contacts { display: flex; flex-direction: column; gap: 7px; }
.s-closing .contacts span { font-size: 13px; color: var(--mid); }
.s-closing .contacts strong { color: var(--green); font-weight: 600; }
.s-closing .bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--green), var(--orange), var(--purple));
}

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
}
.modal { background: var(--white); border-radius: 10px; padding: 22px 26px; width: 540px; box-shadow: 0 24px 64px rgba(0,0,0,.18); }
.modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 14px; }
.modal-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
.modal-card {
  aspect-ratio: 16/9; border: 1.5px solid var(--border); border-radius: 6px;
  cursor: pointer; overflow: hidden; position: relative; background: var(--bg); transition: border-color .12s;
}
.modal-card:hover { border-color: var(--dark); }
.modal-card-lbl {
  position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
  font-size: 8px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
  background: rgba(255,255,255,.9); color: var(--dark);
  padding: 1px 5px; border-radius: 3px; white-space: nowrap;
}
.modal-footer { display: flex; justify-content: flex-end; }
.modal-cancel { padding: 7px 14px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 12px; background: var(--white); }
.modal-cancel:hover { background: var(--light); }

/* ── PDF ── */
.pdf-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.48); z-index: 2000; display: flex; align-items: center; justify-content: center; }
.pdf-box { background: #fff; border-radius: 10px; padding: 30px 38px; text-align: center; min-width: 280px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.pdf-box h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.pdf-box p { font-size: 12px; color: var(--mid); margin-bottom: 14px; }
.pdf-bar { height: 4px; background: var(--light); border-radius: 2px; overflow: hidden; }
.pdf-fill { height: 100%; background: linear-gradient(90deg,var(--green),var(--orange)); border-radius: 2px; transition: width .3s; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="logo-mark">
    <svg viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M88,78 C54,72 12,90 12,114 C12,144 28,198 58,210 C72,208 82,190 82,160 C82,132 84,106 88,78 Z" fill="#5ab848"/>
      <path d="M118,78 C138,68 172,82 168,110 C164,136 148,162 130,178 C116,188 100,184 90,174 C94,156 108,124 114,98 C116,86 118,82 118,78 Z" fill="#f5901e"/>
      <circle cx="103" cy="46" r="26" fill="#9b2c8e"/>
    </svg>
    <span>TradeCruiser</span>
  </div>
  <div class="sep"></div>
  <button class="tb-btn" onclick="openModal()">+ Slide</button>
  <button class="tb-btn" onclick="duplicateCurrent()">Duplica</button>
  <button class="tb-btn" onclick="deleteCurrent()">Elimina</button>
  <div class="sep"></div>
  <button class="tb-btn" onclick="moveSlide(-1)">↑</button>
  <button class="tb-btn" onclick="moveSlide(1)">↓</button>
  <div class="toolbar-right">
    <span class="slide-counter" id="counter">1 / 1</span>
    <button class="tb-btn primary" onclick="exportPDF()">Salva PDF</button>
  </div>
</div>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-top">
      <span>Slide</span>
      <button class="add-btn" onclick="openModal()">+</button>
    </div>
    <div class="slide-list" id="slideList"></div>
    <div class="tpl-section">
      <h4>Aggiungi</h4>
      <div class="tpl-grid" id="tplGrid"></div>
    </div>
  </div>

  <div class="canvas-area">
    <div class="slide-wrapper" id="slideWrapper"></div>
  </div>

  <div class="props">
    <div>
      <h4>Sfondo slide</h4>
      <div class="swatches" id="swatches"></div>
      <div class="prop-row">
        <label>Colore libero</label>
        <input type="color" id="bgPicker" value="#F7F3ED" onchange="applyBg(this.value)">
      </div>
    </div>
    <div>
      <h4>Documento</h4>
      <div class="prop-row">
        <label>Nome file PDF</label>
        <input type="text" id="docTitle" value="TradeCruiser Presentazione">
      </div>
    </div>
    <div>
      <h4>Info</h4>
      <p class="hint">Clicca su qualsiasi testo per modificarlo.<br><br>← → naviga le slide.<br><br><strong>Salva PDF</strong> esporta tutte le slide.</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>Scegli layout</h3>
    <div class="modal-grid" id="modalGrid"></div>
    <div class="modal-footer">
      <button class="modal-cancel" onclick="closeModal()">Annulla</button>
    </div>
  </div>
</div>

<div class="pdf-overlay" id="pdfOverlay" style="display:none">
  <div class="pdf-box">
    <h3>Esportazione PDF</h3>
    <p id="pdfStatus">Preparazione...</p>
    <div class="pdf-bar"><div class="pdf-fill" id="pdfFill" style="width:0%"></div></div>
  </div>
</div>

<script>
// ══════════════════════════
//  LOGO SVG (icon only)
//  Accurate to the actual TradeCruiser logo:
//  - purple circle (head)
//  - green left wing sweeping down-left
//  - orange right wing curving right then down
// ══════════════════════════
const LOGO_ICON = `<svg viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- GREEN: belly IMMEDIATELY widens upper-left near circle, long taper down to tip -->
  <path d="M88,78 C54,72 12,90 12,114 C12,144 28,198 58,210 C72,208 82,190 82,160 C82,132 84,106 88,78 Z" fill="#5ab848"/>
  <!-- ORANGE: belly IMMEDIATELY widens upper-right near circle, tapers and tip curls left -->
  <path d="M118,78 C138,68 172,82 168,110 C164,136 148,162 130,178 C116,188 100,184 90,174 C94,156 108,124 114,98 C116,86 118,82 118,78 Z" fill="#f5901e"/>
  <!-- PURPLE: circle head, top-center -->
  <circle cx="103" cy="46" r="26" fill="#9b2c8e"/>
</svg>`;

const WM = ``;

const TPLS = [
  { id:'cover',   label:'Copertina' },
  { id:'section', label:'Sezione' },
  { id:'content', label:'Contenuto' },
  { id:'two',     label:'Due colonne' },
  { id:'stats',   label:'Statistiche' },
  { id:'quote',   label:'Citazione' },
  { id:'closing', label:'Chiusura' },
];

const GENS = { cover:gCover, section:gSection, content:gContent, two:gTwo, stats:gStats, quote:gQuote, closing:gClosing };

// ══════════════════════════
//  STATE
// ══════════════════════════
let slides=[], cur=0;

function buildHTML(s) { return GENS[s.type](s.data||{}); }

function mountSlide(idx) {
  const s=slides[idx];
  const w=document.getElementById('slideWrapper');
  w.innerHTML = s._html || buildHTML(s);
  w.querySelectorAll('[contenteditable]').forEach(el=>{
    el.addEventListener('blur', saveHTML);
    el.addEventListener('input', saveHTML);
  });
  document.getElementById('counter').textContent=`${idx+1} / ${slides.length}`;
  document.getElementById('bgPicker').value = s.data?.bg || '#F7F3ED';
}

function saveHTML() { slides[cur]._html=document.getElementById('slideWrapper').innerHTML; }

function renderSidebar() {
  const list=document.getElementById('slideList');
  list.innerHTML='';
  const scale=172/960;
  slides.forEach((s,i)=>{
    const thumb=document.createElement('div');
    thumb.className='slide-thumb'+(i===cur?' active':'');
    thumb.style.height=Math.round(172*9/16)+'px';
    const inner=document.createElement('div');
    inner.style.cssText=`width:960px;height:540px;transform:scale(${scale});transform-origin:top left;overflow:hidden;pointer-events:none;`;
    inner.innerHTML=s._html||buildHTML(s);
    thumb.appendChild(inner);
    const num=document.createElement('div');
    num.className='thumb-num'; num.textContent=i+1;
    thumb.appendChild(num);
    const del=document.createElement('button');
    del.className='thumb-del'; del.textContent='×';
    del.onclick=e=>{e.stopPropagation();deleteSlide(i);};
    thumb.appendChild(del);
    thumb.onclick=()=>selectSlide(i);
    list.appendChild(thumb);
  });
}

function selectSlide(idx) { saveHTML(); cur=idx; mountSlide(idx); renderSidebar(); }

function addSlide(type) {
  saveHTML();
  slides.splice(cur+1,0,{type,data:{}});
  cur=cur+1; mountSlide(cur); renderSidebar(); closeModal();
}

function duplicateCurrent() {
  saveHTML();
  slides.splice(cur+1,0,JSON.parse(JSON.stringify(slides[cur])));
  cur=cur+1; mountSlide(cur); renderSidebar();
}

function deleteCurrent() { deleteSlide(cur); }
function deleteSlide(i) {
  if(slides.length<=1) return;
  slides.splice(i,1);
  if(cur>=slides.length) cur=slides.length-1;
  mountSlide(cur); renderSidebar();
}

function moveSlide(dir) {
  saveHTML();
  const ni=cur+dir;
  if(ni<0||ni>=slides.length) return;
  [slides[cur],slides[ni]]=[slides[ni],slides[cur]];
  cur=ni; mountSlide(cur); renderSidebar();
}

function applyBg(color) {
  saveHTML();
  if(!slides[cur].data) slides[cur].data={};
  slides[cur].data.bg=color;
  const el=document.querySelector('#slideWrapper .slide');
  if(el) el.style.background=color;
  saveHTML();
}

function openModal() { document.getElementById('modal').style.display='flex'; buildModalGrid(); }
function closeModal() { document.getElementById('modal').style.display='none'; }

function buildModalGrid() {
  const g=document.getElementById('modalGrid'); g.innerHTML='';
  const scale=152/960;
  TPLS.forEach(t=>{
    const card=document.createElement('div'); card.className='modal-card';
    const inner=document.createElement('div');
    inner.style.cssText=`position:absolute;inset:0;width:960px;height:540px;transform:scale(${scale});transform-origin:top left;overflow:hidden;pointer-events:none;`;
    inner.innerHTML=buildHTML({type:t.id,data:{}});
    card.appendChild(inner);
    const lbl=document.createElement('div'); lbl.className='modal-card-lbl'; lbl.textContent=t.label;
    card.appendChild(lbl);
    card.onclick=()=>addSlide(t.id);
    g.appendChild(card);
  });
}

function buildTplGrid() {
  const g=document.getElementById('tplGrid');
  const scale=82/960;
  TPLS.forEach(t=>{
    const btn=document.createElement('div'); btn.className='tpl-btn';
    const inner=document.createElement('div');
    inner.style.cssText=`position:absolute;inset:0;width:960px;height:540px;transform:scale(${scale});transform-origin:top left;overflow:hidden;pointer-events:none;`;
    inner.innerHTML=buildHTML({type:t.id,data:{}});
    btn.appendChild(inner);
    const lbl=document.createElement('span'); lbl.textContent=t.label; btn.appendChild(lbl);
    btn.onclick=()=>addSlide(t.id); g.appendChild(btn);
  });
}

function buildSwatches() {
  const row=document.getElementById('swatches');
  SWATCHES.forEach(c=>{
    const sw=document.createElement('div'); sw.className='swatch';
    sw.style.background=c; sw.title=c;
    sw.onclick=()=>{ applyBg(c); document.getElementById('bgPicker').value=c; };
    row.appendChild(sw);
  });
}

async function exportPDF() {
  saveHTML();
  const ov=document.getElementById('pdfOverlay');
  const st=document.getElementById('pdfStatus');
  const fi=document.getElementById('pdfFill');
  ov.style.display='flex';
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:'landscape',unit:'px',format:[960,540]});
  const title=document.getElementById('docTitle').value||'Presentazione';
  pdf.setProperties({title});
  const tmp=document.createElement('div');
  tmp.style.cssText='position:fixed;left:-9999px;top:0;width:960px;height:540px;overflow:hidden;z-index:-1;';
  document.body.appendChild(tmp);
  for(let i=0;i<slides.length;i++){
    st.textContent=`Slide ${i+1} di ${slides.length}...`;
    fi.style.width=(i/slides.length*90)+'%';
    tmp.innerHTML=slides[i]._html||buildHTML(slides[i]);
    await new Promise(r=>setTimeout(r,100));
    const canvas=await html2canvas(tmp,{width:960,height:540,scale:2,useCORS:true,backgroundColor:null});
    const img=canvas.toDataURL('image/jpeg',.95);
    if(i>0) pdf.addPage([960,540],'landscape');
    pdf.addImage(img,'JPEG',0,0,960,540);
  }
  document.body.removeChild(tmp);
  fi.style.width='100%'; st.textContent='Salvataggio...';
  await new Promise(r=>setTimeout(r,200));
  pdf.save(title.replace(/\s+/g,'_')+'.pdf');
  ov.style.display='none'; fi.style.width='0%';
}

document.addEventListener('keydown',e=>{
  if(e.target.isContentEditable||e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown'){if(cur<slides.length-1)selectSlide(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){if(cur>0)selectSlide(cur-1);}
  else if(e.key==='Escape') closeModal();
});

buildSwatches(); buildTplGrid(); mountSlide(0); renderSidebar();
</script>
